name: build-and-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Версия тега должна совпадать с версией проекта
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          app = re.search(r'__version__ = "([^"]+)"', open("yaklass_app/__init__.py", encoding="utf-8").read()).group(1)
          assert tag == ver == app, f"версии не совпадают: тег {tag!r}, pyproject {ver!r}, __version__ {app!r}"
          print("версия", tag, "совпадает во всех местах")
          PY
      - name: Системные библиотеки Qt (offscreen)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -e ".[server,gui,dev]"
      - name: Тесты (без sample-страниц ЯКласса — они в репозиторий не входят)
        env: { QT_QPA_PLATFORM: offscreen }
        run: pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[gui]" pyinstaller
      - name: Сборка одного .exe
        shell: bash
        env: { YK_ONEFILE: "1" }
        run: |
          cd packaging && pyinstaller yaklass-app.spec --noconfirm --distpath ../dist-app --workpath ../build-app
      - name: Самопроверка
        shell: bash
        env: { QT_QPA_PLATFORM: offscreen }
        run: ./dist-app/YaklassSolver.exe --selftest
      - uses: actions/upload-artifact@v4
        with: { name: windows-exe, path: dist-app/YaklassSolver.exe }

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Системные библиотеки Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      - run: pip install ".[gui]" pyinstaller
      - name: Сборка папки приложения
        run: cd packaging && pyinstaller yaklass-app.spec --noconfirm --distpath ../dist-app --workpath ../build-app
      - name: Самопроверка
        env: { QT_QPA_PLATFORM: offscreen }
        run: ./dist-app/YaklassSolver/YaklassSolver --selftest
      - name: AppImage
        run: bash packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux-appimage, path: dist-app/YaklassSolver-x86_64.AppImage }

  python-package:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: python-wheel, path: dist/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, python-package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*/* --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes
